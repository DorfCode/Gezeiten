<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wasserstandsvorhersage – Hooge Anleger</title>
    <style>
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background-color: #f7f9fa;
            color: #1a1a1a;
            padding: 20px 10px;
            margin: 0;
        }
        .container {
            max-width: 820px;
            margin: 0 auto;
            background: #ffffff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border-radius: 4px;
            overflow: hidden;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 15px;
            text-align: left;
        }
        thead th {
            background-color: #005a8c;
            color: #ffffff;
            font-weight: 600;
            padding: 12px 14px;
            border-bottom: 2px solid #003e61;
        }
        tbody td {
            padding: 9px 14px;
            border-bottom: 1px solid #edf1f5;
        }
        tbody tr:nth-child(even) {
            background-color: #f4f8fb;
        }
        tr.day-border td {
            border-top: 2px solid #005a8c;
        }
        .date-col {
            font-weight: 500;
            white-space: nowrap;
        }
        .phase-np {
            color: #d18239;
            font-weight: 500;
        }
        .reference-footer {
            background-color: #005a8c;
            color: #ffffff;
            padding: 12px 16px;
            font-size: 14px;
            line-height: 1.6;
        }
        .reference-footer span.label {
            font-weight: bold;
            display: inline-block;
            min-width: 55px;
        }
    </style>
</head>
<body>

<div class="container">
    <table id="forecast-table">
        <thead>
            <tr>
                <th>Datum</th>
                <th>Uhrzeit</th>
                <th>Höhe über SKN [m]</th>
                <th>Ereignis</th>
                <th>Phase</th>
                <th>Abw. vom Normalwert</th>
            </tr>
        </thead>
        <tbody id="forecast-body">
            <tr><td colspan="6" style="text-align:center; padding: 20px;">Lade Daten...</td></tr>
        </tbody>
    </table>

    <div class="reference-footer">
        <div><span class="label">MHW:</span> <span id="mhw-value">6,45 m über PNP</span></div>
        <div><span class="label">MNW:</span> <span id="mnw-value">3,59 m über PNP</span></div>
    </div>
</div>

<script>
    const apiUrl = 'https://gdi.bsh.de/ldproxy/rest/services/WaterLevelForecast/collections/waterlevelforecastdata/items/hooge_anleger?lang=en&f=json';

    async function loadForecast() {
        const tbody = document.getElementById('forecast-body');

        try {
            const response = await fetch(apiUrl);
            const geojson = await response.json();
            const props = geojson.properties || {};

            // MHW / MNW Werte aktualisieren, falls im Objekt vorhanden
            if (props.mean_high_water) document.getElementById('mhw-value').textContent = (props.mean_high_water / 100).toFixed(2).replace('.', ',') + ' m über PNP';
            if (props.mean_low_water) document.getElementById('mnw-value').textContent = (props.mean_low_water / 100).toFixed(2).replace('.', ',') + ' m über PNP';

            const events = props.high_water_low_water || [];
            const chartDatum = props.chartdatum_relative_to_gaugezero || 0;

            // Zeitfenster: Ab sofort bis in 3 Tagen
            const now = new Date();
            const endLimit = new Date();
            endLimit.setDate(now.getDate() + 3);

            const filteredEvents = events.filter(item => {
                const ts = new Date(item.event_timestamp);
                return ts >= now && ts <= endLimit;
            });

            tbody.innerHTML = '';
            let lastDayKey = '';

            filteredEvents.forEach(item => {
                const dateObj = new Date(item.event_timestamp);

                const weekdays = ['So.', 'Mo.', 'Di.', 'Mi.', 'Do.', 'Fr.', 'Sa.'];
                const dayLabel = `${weekdays[dateObj.getDay()]}, ${String(dateObj.getDate()).padStart(2, '0')}.${String(dateObj.getMonth() + 1).padStart(2, '0')}.${dateObj.getFullYear()}`;
                const timeLabel = `${String(dateObj.getHours()).padStart(2, '0')}:${String(dateObj.getMinutes()).padStart(2, '0')}`;

                // Tidenhöhe in Metern über SKN
                let heightFormatted = '-';
                const rawHeight = item.forecast_value ?? item.tidal_prediction_value;
                if (rawHeight != null) {
                    const sknVal = chartDatum > 0 ? (rawHeight - chartDatum) : rawHeight;
                    heightFormatted = (sknVal / 100).toFixed(2).replace('.', ',');
                }

                // Ereignis mit Pfeil
                const arrow = item.event === 'HW' ? '↑ HW' : (item.event === 'NW' ? '↓ NW' : (item.event || ''));

                // ABWEICHUNG DIREKT ÜBERNEHMEN:
                // Nimmt zuerst die offizielle BSH-Abweichung; falls null, das MOS-Modell r0
                let rawDeviation = item.forecast_deviation ?? item.mos_forecast_r0_deviation;
                let deviationText = '-';

                if (rawDeviation !== null && rawDeviation !== undefined) {
                    deviationText = String(rawDeviation) + ' m';
                }

                // Zeile zusammenbauen
                const tr = document.createElement('tr');
                const isNewDay = dayLabel !== lastDayKey;

                if (isNewDay) {
                    if (lastDayKey !== '') tr.classList.add('day-border');
                    tr.innerHTML += `<td class="date-col">${dayLabel}</td>`;
                    lastDayKey = dayLabel;
                } else {
                    tr.innerHTML += `<td class="date-col"></td>`;
                }

                tr.innerHTML += `
                    <td>${timeLabel}</td>
                    <td>${heightFormatted}</td>
                    <td>${arrow}</td>
                    <td class="phase-np">Np</td>
                    <td>${deviationText}</td>
                `;

                tbody.appendChild(tr);
            });

        } catch (error) {
            tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:red; padding:20px;">Fehler: ${error.message}</td></tr>`;
        }
    }

    loadForecast();
</script>
</body>
</html>
