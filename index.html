<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wasserstandsvorhersage – Hooge Anleger</title>
    <style>
        body {
            font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif;
            background-color: #f7f9fa;
            color: #1a1a1a;
            padding: 24px 12px;
            margin: 0;
        }
        .container {
            max-width: 820px;
            margin: 0 auto;
            background: #ffffff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border-radius: 4px;
            overflow: hidden;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 15px;
            text-align: left;
        }
        thead th {
            background-color: #005a8c;
            color: #ffffff;
            font-weight: 600;
            padding: 12px 16px;
            border-bottom: 2px solid #003e61;
        }
        tbody td {
            padding: 10px 16px;
            border-bottom: 1px solid #edf1f5;
        }
        tbody tr:nth-child(even) {
            background-color: #f4f8fb;
        }
        tr.day-border td {
            border-top: 2px solid #005a8c;
        }
        .date-col {
            font-weight: 500;
            white-space: nowrap;
        }
        .event-hw, .event-nw {
            color: #111;
        }
        .phase-np {
            color: #d18239;
            font-weight: 500;
        }
        .deviation {
            font-variant-numeric: tabular-nums;
        }
        .status-cell {
            text-align: center;
            padding: 30px;
            color: #666;
        }
        /* Fußbereich für mittlere Werte (MHW / MNW) */
        .reference-footer {
            background-color: #005a8c;
            color: #ffffff;
            padding: 14px 18px;
            font-size: 15px;
            line-height: 1.6;
            border-top: 1px solid #00446b;
        }
        .reference-footer span.label {
            font-weight: bold;
            display: inline-block;
            min-width: 55px;
        }
    </style>
</head>
<body>

<div class="container">
    <table id="forecast-table">
        <thead>
            <tr>
                <th>Datum</th>
                <th>Uhrzeit</th>
                <th>Höhe über SKN [m]</th>
                <th>Ereignis</th>
                <th>Phase</th>
                <th>Abw. vom Normalwert</th>
            </tr>
        </thead>
        <tbody id="forecast-body">
            <tr>
                <td colspan="6" class="status-cell">Lade Vorhersagedaten des BSH...</td>
            </tr>
        </tbody>
    </table>

    <div class="reference-footer" id="reference-values">
        <div><span class="label">MHW:</span> <span id="mhw-value">6,45 m über PNP</span></div>
        <div><span class="label">MNW:</span> <span id="mnw-value">3,59 m über PNP</span></div>
    </div>
</div>

<script>
    const apiUrl = 'https://gdi.bsh.de/ldproxy/rest/services/WaterLevelForecast/collections/waterlevelforecastdata/items/hooge_anleger?lang=en&f=json';

    async function loadForecast() {
        const tbody = document.getElementById('forecast-body');

        try {
            const response = await fetch(apiUrl);
            if (!response.ok) throw new Error(`HTTP-Fehler ${response.status}`);
            
            const geojson = await response.json();
            const props = geojson.properties || {};

            // Mittlere Werte aus den Metadaten der Station aktualisieren (mit Fallback auf Pegel Hooge Anleger)
            const mhwRaw = props.mean_high_water ?? props.mhw ?? props.mean_high_water_level;
            const mnwRaw = props.mean_low_water ?? props.mnw ?? props.mean_low_water_level;

            if (mhwRaw != null) {
                const mhwVal = mhwRaw > 50 ? (mhwRaw / 100).toFixed(2) : Number(mhwRaw).toFixed(2);
                document.getElementById('mhw-value').textContent = `${mhwVal.replace('.', ',')} m über PNP`;
            }
            if (mnwRaw != null) {
                const mnwVal = mnwRaw > 50 ? (mnwRaw / 100).toFixed(2) : Number(mnwRaw).toFixed(2);
                document.getElementById('mnw-value').textContent = `${mnwVal.replace('.', ',')} m über PNP`;
            }
            
            const events = props.high_water_low_water || [];
            const chartDatum = props.chartdatum_relative_to_gaugezero || 0;

            if (!Array.isArray(events) || events.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="status-cell">Keine Vorhersagewerte im Datensatz vorhanden.</td></tr>';
                return;
            }

            // Zeitfenster: Ab heute 00:00 Uhr bis in 3 Tagen 23:59 Uhr
            const now = new Date();
            const startLimit = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0);
            const endLimit = new Date(startLimit);
            endLimit.setDate(startLimit.getDate() + 3);
            endLimit.setHours(23, 59, 59, 999);

            const filteredEvents = events.filter(item => {
                const ts = new Date(item.event_timestamp);
                return ts >= startLimit && ts <= endLimit;
            });

            if (filteredEvents.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="status-cell">Keine Ereignisse für die nächsten 3 Tage ermittelt.</td></tr>';
                return;
            }

            tbody.innerHTML = '';
            let lastDayKey = '';

            filteredEvents.forEach(item => {
                const dateObj = new Date(item.event_timestamp);

                const weekdays = ['So.', 'Mo.', 'Di.', 'Mi.', 'Do.', 'Fr.', 'Sa.'];
                const dayName = weekdays[dateObj.getDay()];
                const day = String(dateObj.getDate()).padStart(2, '0');
                const month = String(dateObj.getMonth() + 1).padStart(2, '0');
                const year = dateObj.getFullYear();
                const dateLabel = `${dayName}, ${day}.${month}.${year}`;

                const hours = String(dateObj.getHours()).padStart(2, '0');
                const minutes = String(dateObj.getMinutes()).padStart(2, '0');
                const timeLabel = `${hours}:${minutes}`;

                // Höhe über SKN in Metern berechnen
                let heightFormatted = '-';
                const rawValue = item.tidal_prediction_value ?? item.forecast_value;
                if (rawValue != null) {
                    let cmOverSkn = rawValue;
                    if (chartDatum > 0 && rawValue > chartDatum) {
                        cmOverSkn = rawValue - chartDatum;
                    }
                    heightFormatted = (cmOverSkn / 100).toFixed(2).replace('.', ',');
                }

                // Ereignisdarstellung mit Pfeilen
                let eventDisplay = item.event || '';
                if (item.event === 'HW') {
                    eventDisplay = '<span class="event-hw">↑ HW</span>';
                } else if (item.event === 'NW') {
                    eventDisplay = '<span class="event-nw">↓ NW</span>';
                }

                const phaseDisplay = item.phase || item.tidal_phase || 'Np';

                // Abweichung vom Normalwert formatieren
                let devDisplay = '-';
                const devVal = item.forecast_deviation ?? item.mos_forecast_r0_deviation;
                if (devVal != null && !isNaN(devVal)) {
                    const devNum = Number(devVal);
                    const sign = devNum > 0 ? '+' : '';
                    devDisplay = `${sign}${devNum.toFixed(1).replace('.', ',')} m`;
                }

                const tr = document.createElement('tr');
                const isNewDay = dateLabel !== lastDayKey;

                if (isNewDay) {
                    if (lastDayKey !== '') tr.classList.add('day-border');
                    tr.innerHTML += `<td class="date-col">${dateLabel}</td>`;
                    lastDayKey = dateLabel;
                } else {
                    tr.innerHTML += `<td class="date-col"></td>`;
                }

                tr.innerHTML += `
                    <td>${timeLabel}</td>
                    <td>${heightFormatted}</td>
                    <td>${eventDisplay}</td>
                    <td class="phase-np">${phaseDisplay}</td>
                    <td class="deviation">${devDisplay}</td>
                `;

                tbody.appendChild(tr);
            });

        } catch (error) {
            console.error('Fehler bei der Datenverarbeitung:', error);
            tbody.innerHTML = `<tr><td colspan="6" class="status-cell" style="color: #b00020;">Fehler beim Laden der BSH-Daten: ${error.message}</td></tr>`;
        }
    }

    loadForecast();
</script>
</body>
</html>
